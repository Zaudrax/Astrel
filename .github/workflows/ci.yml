# Intégration continue d'Astrel (P2, lot 3).
#
# - « linux » (à chaque push et pull request) : contrôle de la machine, tests
#   Python, tests Node (HUD, pont WhatsApp, worker des images et vidéos IA ; 05/11),
#   rendu du HUD en Chrome headless. Doit être VERT.
# - « portage » (macOS et Windows, à la demande, une fois par semaine, et à chaque push
#   sur la branche « portage ») : MESURE où en est le portage ; un échec n'est
#   jamais bloquant (rapport dans le job, pas de mail d'échec).
#   Pourquoi pas à chaque push : sur un dépôt PRIVÉ, GitHub décompte une minute
#   macOS pour 10 et une minute Windows pour 2 sur le quota gratuit
#   (2 000 min/mois en offre Free). Un passage complet ≈ 10 à 15 min par OS.
#
# Aucun vrai Claude ici : tools/ci/faux-claude répond à `--version`,
# `auth status` et tient une session minimale en stream-json (essai de
# démarrage, tools/ci/demarrage.py) ; les tests du cerveau utilisent des enregistrements
# (tests/fixtures). Le micro, la bulle et les raccourcis ne se testent que sur
# une vraie machine.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # lundi 5 h UTC : mesure hebdomadaire du portage

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    # 05/11 (T45) : 30 → 40 min ; le worker des images ajoute ~9 min (8 à 10 min avant, mesuré le 05/11)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Faux Claude Code dans le PATH
        run: echo "$GITHUB_WORKSPACE/tools/ci/faux-claude" >> "$GITHUB_PATH"
      # 03/11 : aperçu des PDF du fil (astrel/medias.py : pdfinfo, pdftoppm), contrôlé par hud_check_rendu
      - name: poppler pour les aperçus PDF
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Contrôle de la machine (avant installation)
        run: python tools/check_install.py --ci
      - name: Dépendances Python dans .venv, comme install.py (sans les ~1 Go de CUDA, inutiles aux tests)
        run: |
          grep -v '^nvidia-' requirements.txt > /tmp/requirements-ci.txt
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r /tmp/requirements-ci.txt websockets
      # 05/11 (T45) : comme install.py, versions FIXÉES des package-lock ; servent aux tests Node ci-dessous
      - name: Dépendances Node du pont WhatsApp et du worker des images et vidéos IA (npm ci, comme install.py)
        run: |
          (cd whatsapp && npm ci --no-audit --no-fund)
          (cd imagegen && npm ci --no-audit --no-fund)
      - name: Tests Python (dont une partie des tests Node du HUD, relancés par pytest)
        run: .venv/bin/python -m pytest -q
      # 05/11 (T45) : TOUS les tests Node, plus seulement ceux que pytest relance (7 fichiers du HUD sur 13 avant)
      - name: Tests Node du HUD (hud/tests, tous les fichiers)
        if: always()
        timeout-minutes: 5
        working-directory: hud
        run: node --test tests/*.test.mjs
      - name: Tests Node du pont WhatsApp (faux Baileys, aucun compte)
        if: always()
        timeout-minutes: 5
        working-directory: whatsapp
        run: node --test
      - name: Tests Node du worker des images et vidéos IA (fausses pages locales, Chrome headless de l'image, aucun site)
        if: always()
        timeout-minutes: 20
        working-directory: imagegen
        run: node --test --test-concurrency=1
      - name: Rendu du HUD en Chrome headless
        run: .venv/bin/python tools/hud_check_rendu.py
      - name: Essai de démarrage (vrai Astrel, faux Claude, sans micro ni haut-parleur)
        if: always()
        run: .venv/bin/python tools/ci/demarrage.py

  portage:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref_name == 'portage'
    strategy:
      fail-fast: false
      matrix:
        # 06/11 : macos-14 retiré par GitHub (« configuration macos-14-arm64-us-default is not supported », job annulé en 1 s)
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    # 03/11 (demande : un mail d'échec à chaque envoi) : MESURE partout, branche portage comprise ; les échecs
    # restent dans le rapport du job, ils ne font plus échouer l'exécution. Seul « linux » doit être vert.
    continue-on-error: true
    timeout-minutes: 75
    env:
      PYTHONUTF8: "1"  # 03/11 : Astrel tourne en mode UTF-8 sous Windows (platform.en_utf8) ; les tests aussi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 05/11 (T45) : même Node que le job linux (avant : celui de l'image, version variable)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Faux Claude Code dans le PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/tools/ci/faux-claude" >> "$GITHUB_PATH"
      - name: cairo pour la bulle (macOS, comme dans le README)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config
      - name: Contrôle de la machine (avant installation)
        run: python tools/check_install.py --ci
      - name: "Dépendances complètes dans .venv, comme install.py (03/11 : les hooks appellent l'interpréteur de la venv)"
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/bin/python ]; then VPY=.venv/bin/python; else VPY=.venv/Scripts/python.exe; fi
          echo "VPY=$VPY" >> "$GITHUB_ENV"
          "$VPY" -m pip install -r requirements.txt websockets pytest-timeout==2.4.0 pytest-reportlog==0.4.0
      - name: Essai de démarrage (vrai Astrel, faux Claude, sans micro ni haut-parleur)
        shell: bash
        run: '"$VPY" tools/ci/demarrage.py'
      # 05/11 (T45) : tests Node, en MESURE comme le reste du job
      - name: Tests Node du HUD (hud/tests, tous les fichiers)
        if: always()
        timeout-minutes: 5
        shell: bash
        working-directory: hud
        run: node --test tests/*.test.mjs
      - name: Tests Node du pont WhatsApp (faux Baileys, aucun compte)
        if: always()
        timeout-minutes: 8
        shell: bash
        working-directory: whatsapp
        run: npm ci --no-audit --no-fund && node --test
      # Worker des images et vidéos : macOS seulement (Chrome de l'image désigné par ASTREL_IMAGEGEN_CHROME) ;
      # pas sous Windows : ses tests cherchent les Chrome restants par `ps -eo`, absent de Windows.
      - name: Tests Node du worker des images et vidéos IA (macOS, fausses pages locales, aucun site)
        if: always() && runner.os == 'macOS'
        # 05/11 : première passe bloquée en fin de video.test.mjs (Chrome resté ouvert ?) : mesure, non bloquant,
        # tant qu'un vrai Mac ne l'a pas expliqué
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        working-directory: imagegen
        env:
          ASTREL_IMAGEGEN_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: npm ci --no-audit --no-fund && node --test --test-concurrency=1
      - name: Tests de la couche plateforme, de l'installation et du canal local (plan P6)
        if: always()
        shell: bash
        run: '"$VPY" -m pytest -q -p no:cacheprovider tests/test_platform.py tests/test_install.py tests/test_ipc.py'
      - name: Suite complète (mesure)
        if: always()
        # 03/11 : délai sur l'ÉTAPE, pas sur le job : un job coupé perd tout son journal (macOS restait muet).
        timeout-minutes: 40
        shell: bash
        run: '"$VPY" -m pytest -q -p no:cacheprovider -o console_output_style=count --durations=25 --timeout=120 --report-log=rapport-tests.jsonl'
      - name: Rapport test par test (durées), gardé même si l'étape a été coupée
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-${{ matrix.os }}
          path: rapport-tests.jsonl
          if-no-files-found: ignore
